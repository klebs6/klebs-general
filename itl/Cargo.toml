[workspace]
members = [
  "crates/itl-core",
  "crates/itl-parse",
  "crates/itl-vfs",
  "crates/itl-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
