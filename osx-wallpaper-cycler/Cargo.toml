objc2 = "*"
sha2 = "*"
rand = "*"
futures = "*"
toml = "*"
tempfile = "*"
httpmock = "*"
tracing-subscriber = "*"
serde_json = "*"
serde = {version = "*", features = [ "derive" ] }
async-trait = "*"
objc2-foundation = "*"
