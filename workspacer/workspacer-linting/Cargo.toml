[dependencies.tracing]
workspace = true

[dependencies.workspacer-3p]
path = "../workspacer-3p"
version = "0.5.2"

[dependencies.workspacer-crate]
path = "../workspacer-crate"
version = "0.5.2"

[dependencies.workspacer-crate-interface]
path = "../workspacer-crate-interface"
version = "0.1.2"

[dependencies.workspacer-errors]
path = "../workspacer-errors"
version = "0.1.2"

[dependencies.workspacer-workspace]
path = "../workspacer-workspace"
version = "0.1.2"

[package]
categories = [
    "development-tools",
    "concurrency",
    "command-line-utilities",
    "asynchronous",
]
description = "Async Rust crate for linting workspaces using cargo clippy, capturing detailed reports and converting them to structured errors."
edition = "2024"
keywords = [
    "rust",
    "linting",
    "cargo",
    "clippy",
    "asynchronous",
]
license = "MIT"
name = "workspacer-linting"
version = "0.1.2"
